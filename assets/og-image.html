<html>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #fdfaf8;
    font-family: "Nunito", Arial, sans-serif;
    color: #2f3037;
  }
  /* pink drifting in from the top-right corner, a little echo bottom-left */
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 760px 560px at 100% 0%, #f3cbd8 0%, rgba(243,203,216,0.55) 40%, rgba(253,250,248,0) 72%),
      radial-gradient(ellipse 520px 360px at 0% 100%, rgba(246,214,224,0.7) 0%, rgba(253,250,248,0) 70%);
  }
  .grain {
    position: absolute; inset: 0; opacity: 0.2; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.47  0 0 0 0.35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .content { position: absolute; left: 110px; top: 188px; }
  h1 {
    font-family: "Fredoka", Arial, sans-serif; font-weight: 600;
    font-size: 132px; line-height: 1; letter-spacing: -1.5px; color: #2f3037;
  }
  .sub {
    position: relative; display: inline-block;
    margin-top: 26px;
    font-family: "Fredoka", Arial, sans-serif; font-weight: 500;
    font-size: 60px; color: #b5577f;
  }
  .sub svg { position: absolute; left: -6px; bottom: -22px; }
  .cat { position: absolute; left: 960px; top: 318px; transform: rotate(-4deg); }
</style>
</head>
